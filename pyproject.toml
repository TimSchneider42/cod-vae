[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cod-vae"
version = "0.1.0"
description = "Unofficial PyTorch/JAX reimplementation of COD-VAE, a 3D shape VAE with compact 1D latents (Cho et al., ICCV 2025)."
readme = "README.md"
authors = [
    { name = "Tim Schneider", email = "mail@tim-schneider.me" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "trimesh",
    "scikit-image",
]

[project.urls]
homepage = "https://github.com/TimSchneider42/cod-vae"

[project.optional-dependencies]
torch = ["torch"]
jax = ["jax[cuda12]"]
jax-cpu = ["jax"]
train = ["optax"]
hub = ["huggingface_hub"]
convert = ["torch", "pyyaml"]
tests = ["pytest"]
all = ["torch", "jax[cuda12]", "optax", "huggingface_hub", "pyyaml", "pytest"]

[project.scripts]
cod-vae-convert = "cod_vae.cli:convert_main"
cod-vae-train = "cod_vae.cli:train_main"

[tool.setuptools.packages.find]
include = ["cod_vae*"]
